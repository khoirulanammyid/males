<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corrupt File Generator</title>
    <!-- Memuat Tailwind CSS dari CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Menggunakan font Inter sebagai default */
      body {
        font-family: "Inter", sans-serif;
      }
      /* Style untuk placeholder agar lebih kontras di mode gelap */
      ::placeholder {
        color: #6b7280;
      }
    </style>
  </head>
  <body
    class="bg-gray-900 text-white flex items-center justify-center min-h-screen"
  >
    <div class="w-full max-w-md p-8 space-y-6 bg-gray-800 rounded-xl shadow-lg">
      <div class="text-center">
        <h1 class="text-3xl font-bold text-white">Corrupt File Generator</h1>
        <p class="text-gray-400 mt-2">Create a dummy file with random data.</p>
      </div>

      <!-- Formulir untuk input pengguna -->
      <form id="file-form" class="space-y-6">
        <div>
          <label for="name" class="text-sm font-medium text-gray-300 block mb-2"
            >File Name</label
          >
          <input
            type="text"
            id="name"
            name="name"
            placeholder="e.g., mydocument"
            required
            class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md focus:ring-blue-500 focus:border-blue-500 transition"
          />
        </div>
        <div>
          <label
            for="format"
            class="text-sm font-medium text-gray-300 block mb-2"
            >File Format (Extension)</label
          >
          <input
            type="text"
            id="format"
            name="format"
            placeholder="e.g., doc, jpg, mp4"
            required
            class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md focus:ring-blue-500 focus:border-blue-500 transition"
          />
        </div>
        <div>
          <label for="size" class="text-sm font-medium text-gray-300 block mb-2"
            >File Size (in bytes)</label
          >
          <input
            type="number"
            id="size"
            name="size"
            placeholder="e.g., 1024 for 1 KB"
            required
            min="1"
            class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md focus:ring-blue-500 focus:border-blue-500 transition"
          />
        </div>

        <!-- Tombol untuk submit -->
        <button
          type="submit"
          id="submit-button"
          class="w-full px-4 py-3 font-semibold text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-blue-500 transition-all duration-300 ease-in-out flex items-center justify-center"
        >
          <span id="button-text">Generate & Download</span>
          <!-- Indikator loading, awalnya tersembunyi -->
          <svg
            id="loading-spinner"
            class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
        </button>
      </form>

      <!-- Area untuk menampilkan pesan error -->
      <div
        id="error-message"
        class="hidden p-4 text-sm text-red-300 bg-red-900/50 rounded-lg"
        role="alert"
      ></div>
    </div>

    <script>
      // Menangani logika frontend
      const form = document.getElementById("file-form");
      const submitButton = document.getElementById("submit-button");
      const buttonText = document.getElementById("button-text");
      const loadingSpinner = document.getElementById("loading-spinner");
      const errorMessage = document.getElementById("error-message");

      form.addEventListener("submit", async (event) => {
        event.preventDefault(); // Mencegah form dari submit standar

        // Menampilkan status loading
        buttonText.classList.add("hidden");
        loadingSpinner.classList.remove("hidden");
        submitButton.disabled = true;
        errorMessage.classList.add("hidden");

        // Mengambil data dari form
        const formData = new FormData(form);
        const data = {
          name: formData.get("name"),
          format: formData.get("format"),
          size: formData.get("size"),
        };

        try {
          // URL backend API (dijalankan di port 5001 oleh Docker Compose)
          const response = await fetch("http://localhost:5001/create-file", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });

          if (!response.ok) {
            // Jika respons dari server tidak OK, coba baca error JSON
            const errorData = await response.json();
            throw new Error(
              errorData.error || `HTTP error! Status: ${response.status}`
            );
          }

          // Jika berhasil, proses file untuk diunduh
          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.style.display = "none";
          a.href = url;
          // Mengambil nama file dari header Content-Disposition jika ada, jika tidak buat manual
          const disposition = response.headers.get("content-disposition");
          let filename = `${data.name}.${data.format}`;
          if (disposition && disposition.indexOf("attachment") !== -1) {
            const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
            const matches = filenameRegex.exec(disposition);
            if (matches != null && matches[1]) {
              filename = matches[1].replace(/['"]/g, "");
            }
          }
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);
          a.remove();
        } catch (error) {
          // Menampilkan pesan error di UI
          errorMessage.textContent = `Error: ${error.message}`;
          errorMessage.classList.remove("hidden");
        } finally {
          // Mengembalikan tombol ke keadaan normal
          buttonText.classList.remove("hidden");
          loadingSpinner.classList.add("hidden");
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
